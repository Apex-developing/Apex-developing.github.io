description: "Software developer • building products with clean code and meaningful UX"

url: "https://apex-developing.github.io"
baseurl: ""

repository: "Apex-developing/Apex-developing.github.io"

remote_theme: "mmistakes/minimal-mistakes"

minimal_mistakes_skin: "dark"

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme

defaults:
